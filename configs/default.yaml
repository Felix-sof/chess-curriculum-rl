# Default training configuration for the curriculum-RL chess agent.

# Path (or bare command, if it's on PATH) to the Stockfish UCI binary.
# A bare command name relies on PATH lookup, which can be racy when many
# parallel workers spawn it at once (see training/n_envs) -- prefer an
# absolute path once you know where Stockfish is installed.
stockfish_path: "stockfish"

log_dir: "logs"

curriculum:
  # 0 = random-move bootstrap; 1-3 = full-strength Stockfish limited to
  # 1/2/4 ply of lookahead (a depth ramp -- run 4 found real Stockfish even
  # at "Skill Level 0" is a huge jump up from a random mover: 0.6% score
  # across ~42k games); 4-24 = Stockfish Skill Level 0-20.
  start_level: 0
  max_level: 24
  window_size: 50 # games per rolling win-rate window
  # Run 3 found the model draws ~80% of games even against a random mover
  # (it can rarely force checkmate without search), capping the achievable
  # rolling win rate around 0.6 -- 0.70 was never reached in 3M steps, so
  # promotion never triggered even once. Lowered to a reachable bar.
  promotion_threshold: 0.60

engine:
  think_time: 0.1 # seconds Stockfish spends per move (unused at level 0, the random-move stage)

reward:
  # Run 5 (pretrained + depth-ramp) still avoided winning captures in a live
  # game -- 0.01 was too weak a signal for "taking material is good" to be
  # clearly learned relative to the sparse +-1 terminal reward. Raised 10x.
  material_reward_scale: 0.1
  # Run 3 added a repetition penalty here; explained_variance collapsed to
  # ~0 and approx_kl/clip_fraction spiked (policy instability) by the end,
  # vs. run 2's stable ~0.73 without it. Removed to isolate whether it (or
  # the entropy bonus below) was the cause before trying either again.
  repetition_penalty: 0.0

policy:
  features_dim: 256

training:
  total_timesteps: 5_000_000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  # Run 3 used 0.01 alongside the instability above; run 2 (stable) used the
  # SB3 default of effectively 0. Lowered rather than removed, to keep some
  # exploration pressure without letting it dominate the loss.
  ent_coef: 0.001
  checkpoint_freq: 50_000
  n_envs: 1 # parallel Stockfish environments; raise (e.g. 8) on multi-core machines via --n-envs
